name: Construire l'APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
            echo "Signature avec la clé du dépôt."
          else
            echo "::warning::Secret KEYSTORE_B64 absent : APK signé avec une clé de debug temporaire, chaque mise à jour demandera de désinstaller l'appli."
          fi

      - name: Compilation
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: >-
          gradle assembleRelease --no-daemon --stacktrace
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk mes-transports.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mes-transports-apk
          path: mes-transports.apk

      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" mes-transports.apk \
            --repo "${{ github.repository }}" \
            --title "Mes transports 1.0.${{ github.run_number }}" \
            --notes "APK Android de Mes transports. Sur le téléphone : télécharger mes-transports.apk, l'ouvrir, puis Installer." \
            --latest
